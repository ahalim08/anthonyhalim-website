<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anthony Halim — Finance Leader & Advisor</title>
  <meta name="description" content="Finance leader and advisor for high-growth companies. Building planning systems that make ambition legible." />
  <link rel="icon" type="image/png" href="favicon.png" />
  <meta property="og:title" content="Anthony Halim — Finance Leader & Advisor" />
  <meta property="og:description" content="Finance leader and advisor for high-growth companies. Building planning systems that make ambition legible." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; background: #fff; }
    body { font-family: "Inter Tight", -apple-system, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    a { color: inherit; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#0c0c0e"/>
      <rect x="35" y="35" width="30" height="30" rx="4" fill="#ee6638"/>
    </svg>
  </template>
  <div id="root"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="directions/shared.jsx"></script>
  <script type="text/babel" src="directions/B_swiss.jsx"></script>

  <script type="text/babel" data-presets="react">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "darkMode": false,
      "accent": "#f07400"
    }/*EDITMODE-END*/;

    function App() {
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

      // Apply theme to swissB before render via key
      React.useEffect(() => {
        if (!window.swissB) return;
        if (tweaks.darkMode) {
          window.swissB.paper = '#0c0c0e'; window.swissB.ink = '#f0f0f2';
          window.swissB.rule = 'rgba(240,240,242,0.10)';
          window.swissB.muted = 'rgba(240,240,242,0.55)';
          window.swissB.faint = 'rgba(240,240,242,0.04)';
          // shift rust slightly hotter on dark
          window.swissB.accent = tweaks.accent === '#c84a1f' ? '#ee6638' : tweaks.accent;
        } else {
          window.swissB.paper = '#ffffff'; window.swissB.ink = '#0d0d0e';
          window.swissB.rule = 'rgba(13, 13, 14, 0.10)';
          window.swissB.muted = 'rgba(13, 13, 14, 0.55)';
          window.swissB.faint = 'rgba(13, 13, 14, 0.04)';
          window.swissB.accent = tweaks.accent;
        }
        document.body.style.background = window.swissB.paper;
      }, [tweaks.darkMode, tweaks.accent]);

      const k = `${tweaks.darkMode}-${tweaks.accent}`;

      return (
        <>
          <div key={k}><SwissB /></div>

          <TweaksPanel title="Tweaks">
            <TweakSection title="Theme">
              <TweakToggle label="Dark mode" value={tweaks.darkMode} onChange={(v) => setTweak('darkMode', v)} />
              <TweakColor label="Accent" value={tweaks.accent} onChange={(v) => setTweak('accent', v)} />
            </TweakSection>
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
