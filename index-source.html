<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anthony Halim — Finance Leader &amp; Advisor</title>
  <meta name="description" content="Finance leader and advisor for high-growth companies. Building planning systems for humans and AI." />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta property="og:title" content="Anthony Halim — Finance Leader &amp; Advisor" />
  <meta property="og:description" content="Finance leader and advisor for high-growth companies. Building planning systems for humans and AI." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.anthonyhalim.com/" />
  <meta property="og:image" content="https://www.anthonyhalim.com/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="canonical" href="https://www.anthonyhalim.com/" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; background: #fff; scroll-behavior: smooth; }
    body { font-family: "Inter Tight", -apple-system, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    a { color: inherit; }

    @keyframes dotPulse {
      0% { transform: scale(1); opacity: 1; }
      10% { transform: scale(1.8); opacity: 0.4; }
      20%, 35% { transform: scale(1); opacity: 1; }
      45% { transform: scale(1.8); opacity: 0.4; }
      55%, 70% { transform: scale(1); opacity: 1; }
      80% { transform: scale(1.8); opacity: 0.4; }
      100% { transform: scale(1); opacity: 1; }
    }
    .dot-pulse { animation: dotPulse 3s ease-in-out !important; }

    /* Bookings Memo Builder — animations + responsive */
    @keyframes drawerSlideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @media (max-width: 900px) {
      .builder-memo-col { display: none !important; }
      .builder-sidebar-col { width: 140px !important; }
      .builder-sidebar-col span.sec-label { display: none !important; }
    }
    @media (max-width: 640px) {
      .builder-sidebar-col { display: none !important; }
      .builder-container { height: auto !important; min-height: 480px; max-height: 70vh; }
      .builder-center-col { padding: 14px 18px 16px !important; }
      .builder-peek-bar { flex-direction: column !important; gap: 0 !important; }
      .builder-peek-half { border-right: none !important; border-bottom: 1px solid rgba(13,13,14,0.10); padding: 8px 16px !important; }
      .builder-peek-half:last-child { border-bottom: none; }
      .builder-drawer { max-height: 80% !important; }
      .builder-drawer-tabs button { padding: 10px 12px 8px !important; font-size: 9px !important; }
      .builder-persona-pills { flex-wrap: wrap !important; border-radius: 6px !important; }
      .builder-persona-pills button { flex: 1 1 auto !important; min-width: 0 !important; padding: 8px 8px !important; font-size: 10px !important; }
    }
    @media (max-width: 400px) {
      .builder-container { min-height: 420px; max-height: 75vh; }
      .builder-center-col { padding: 12px 14px 14px !important; }
      .builder-peek-half { padding: 7px 12px !important; }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#0c0c0e"/>
      <rect x="35" y="35" width="30" height="30" rx="4" fill="#a855f7"/>
    </svg>
  </template>
  <div id="root"></div>

  <!-- Load order matters: shell + content + builder pieces, then the main view -->
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="directions/shared.jsx"></script>
  <script type="text/babel" src="directions/builder-data.jsx"></script>
  <script type="text/babel" src="directions/builder-inline.jsx"></script>
  <script type="text/babel" src="directions/builder-details.jsx"></script>
  <script type="text/babel" src="directions/builder-widget.jsx"></script>
  <script type="text/babel" src="directions/B_swiss.jsx?v=3"></script>

  <script type="text/babel" data-presets="react">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "darkMode": false,
      "accent": "#a855f7",
      "metricStyle": "tiles"
    }/*EDITMODE-END*/;

    function App() {
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

      React.useEffect(() => {
        if (!window.swissB) return;
        if (tweaks.darkMode) {
          window.swissB.paper = '#0c0c0e';
          window.swissB.ink = '#f0f0f2';
          window.swissB.rule = 'rgba(240,240,242,0.10)';
          window.swissB.muted = 'rgba(240,240,242,0.55)';
          window.swissB.faint = 'rgba(240,240,242,0.04)';
          window.swissB.accent = tweaks.accent;
        } else {
          window.swissB.paper = '#ffffff';
          window.swissB.ink = '#0d0d0e';
          window.swissB.rule = 'rgba(13, 13, 14, 0.10)';
          window.swissB.muted = 'rgba(13, 13, 14, 0.55)';
          window.swissB.faint = 'rgba(13, 13, 14, 0.04)';
          window.swissB.accent = tweaks.accent;
        }
        document.body.style.background = window.swissB.paper;
        document.body.style.color = window.swissB.ink;
        const root = document.querySelector('[data-sb-root]');
        if (root) root.style.setProperty('--sb-accent', window.swissB.accent);
      }, [tweaks.darkMode, tweaks.accent]);

      const k = `${tweaks.darkMode}-${tweaks.accent}-${tweaks.metricStyle}`;

      return (
        <>
          <div key={k} style={{ '--sb-accent': tweaks.accent }}><SwissB metricStyle={tweaks.metricStyle} /></div>

          <TweaksPanel title="Tweaks">
            <TweakSection title="Theme">
              <TweakToggle label="Dark mode" value={tweaks.darkMode} onChange={(v) => setTweak('darkMode', v)} />
              <TweakColor label="Accent" value={tweaks.accent} onChange={(v) => setTweak('accent', v)} />
              <TweakRadio label="Metric cards" value={tweaks.metricStyle} onChange={(v) => setTweak('metricStyle', v)} options={[{ value: 'tiles', label: 'Tiles' }, { value: 'rules', label: 'Rules' }]} />
            </TweakSection>
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
